extends: existence
message: "Use title case for the page title: capitalize '%s'."
link: "https://ngrok.com/docs/style-guide#titles-and-headings"
nonword: true
level: error
scope: raw
# Flags any all-lowercase word in the frontmatter `title`, other than short
# articles, conjunctions, and prepositions, and lowercase names like ngrok.
tokens:
  - '(?m)(?<=^title:[ \t]*["'']?(?:[^\n]*?[ \t/(])?)(?!(?:a|an|and|as|at|but|by|for|from|if|in|into|nor|of|off|on|onto|or|out|over|per|so|than|the|to|up|via|vs|with|yet)(?![\w''-]))(?!ngrok|vcluster|etc(?![a-z]))[a-z][a-z''-]*(?![\w.])'
