extends: existence
message: "Avoid first-person pronouns such as '%s'—speak to 'you' the reader instead."
link: 'https://developers.google.com/style/pronouns#personal-pronouns'
ignorecase: true
level: warning
nonword: true
# Ignore headings, which can mirror search queries (for example, "Can I use ngrok on Starlink?")
scope: ~heading
# Each token starts with a lookahead that skips matches inside double quotes,
# so quoted search queries like "what is my IP" don't trigger the rule.
tokens:
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])(?:^|\s)I\s
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])(?:^|\s)I,\s
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bI'm\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bme\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bmy\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bmine\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bwe\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bwe'(?:ve|re)\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bours?\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\bus\b
  - (?!(?<=["“][^"“”\n]*)[^"“”\n]*["”])\blet's\b(?:\s+Encrypt)?
exceptions:
  - Let's Encrypt
  - US
