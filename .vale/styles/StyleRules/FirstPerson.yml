extends: existence
message: "Avoid first-person pronouns such as '%s'—speak to 'you' the reader instead."
link: 'https://developers.google.com/style/pronouns#personal-pronouns'
ignorecase: true
level: error
nonword: true
# Make it ignore headings
scope: ~heading
# The lookarounds skip pronouns inside identifiers and domains, like kind-my-cluster
# or us.zpagov.zpa, without skipping a pronoun that ends a sentence.
tokens:
  - (?:^|\s)I\s
  - (?:^|\s)I,\s
  - \bI'm\b
  - (?<![\w.-])me(?![\w-]|\.\w)
  - (?<![\w.-])my(?![\w-]|\.\w)
  - (?<![\w.-])mine(?![\w-]|\.\w)
  - (?<![\w.-])we(?![\w-]|\.\w)
  - (?<![\w.-])we'(?:ve|re)\b
  - (?<![\w.-])ours?(?![\w-]|\.\w)
  - (?<![\w.-])us(?![\w-]|\.\w)
  - \blet's\b(?:\s+Encrypt)?
exceptions:
  - Let's Encrypt
  - US
