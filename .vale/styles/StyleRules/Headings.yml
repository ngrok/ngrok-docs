extends: capitalization
message: "'%s' should use sentence-style capitalization."
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: error
scope: heading
match: $sentence
indicators:
  - ":"
# Vale matches exceptions case-insensitively and then requires the casing listed
# here, so an entry like "Tunnel Group" flags "Tunnel group backends". Only list
# terms whose casing must always win, and never a plain common word. When docs
# legitimately use a term both ways, list both casings (Basic Auth, Basic auth).
#
# Single-word proper nouns belong in the ngrok Vocab (accept.txt), which Vale also
# applies here. Acronyms and names with an inner capital are covered by the
# patterns at the end of the list.
exceptions:
  - 'ERR_NGROK_\d+'
  - I
  - K8s
  - v2
  - v3
  - A/B
  - HTTP
  - 'HTTP/S'
  - TCP/TLS
  - example.tf
  - http_request_complete.v0
  - tcp_connection_closed.v0
  - Let's Encrypt
  # ngrok product terms
  - AI Gateway
  - Agent Endpoint
  - Agent Endpoints
  - Cloud Endpoint
  - Cloud Endpoints
  - Gateway API
  - IP Policy
  - IP Policies
  - Kubernetes Operator
  - Service User
  - Service Users
  - Traffic Inspector
  - Traffic Policy
  - Traffic Policies
  - Traffic Policy Units
  - Universal Gateway
  - Agent
  - agent
  - Agent Dedicated IPs
  - Applying account-wide IP Policies
  - Authtoken
  - authtoken
  - Basic Auth
  - Basic auth
  - Checking IP Policy status
  - Config
  - Dev domains
  - Endpoint Pooling
  - Global Load Balancer
  - Global Server Load Balancing
  - Namespace
  - Operator
  - PROXY Protocol
  - Successfully created IP Policy
  - TCP Addresses
  - TLS Termination
  - TLS termination
  - Tunnel Group
  - Tunnel group
  # Multi-word third-party names
  - Amazon Web Services
  - Content-Length
  - Content-Length handling
  - Content-Type
  - OpenID Connect
  - Visual Studio
  - Wallix Trustelem
  - Argo CD
  - Cisco Webex
  - Common Crawl
  - Docker Desktop
  - External Secrets Operator
  - Facebook Messenger
  - Front Door
  - Home Assistant
  - Log Analytics
  - Microsoft Entra
  - Microsoft Office
  - Microsoft Teams
  - Modern Treasury
  - MQTT Explorer
  - Signal Sciences
  - Sonatype Nexus
  - Terraform Cloud
  - Trend Micro
  - VMware Workspace ONE
  # Acronyms and their plurals: API, HTTPS, SDKs, TPUs.
  # Names with an inner capital: GitHub, DuckDuckGo, OpenAI, gRPC, DDoS.
  # (?-i) keeps them from matching lowercase text like "you'll". The lookarounds
  # stop them from claiming the first word of a longer term like "TCP Addresses",
  # "HTTP/S", or "OpenID Connect", which would leave the rest of it unexcepted.
  - '(?-i)(?<![\w/])[A-Z]{2,}s?(?![\w/]| [A-Z])'
  - '(?-i)(?<![\w/])[A-Za-z]*[a-z][A-Z][A-Za-z]*(?![\w/]| [A-Z])'
