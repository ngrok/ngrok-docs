extends: existence
message: "Put UI text in bold instead of quotes: %s"
link: "https://ngrok.com/docs/style-guide"
ignorecase: true
level: error
nonword: true
# Quotes alone can't tell UI text from a quoted message or value, so only flag
# quoted text next to a cue that it's a control: an action verb before it, or a
# control noun after it. Bold text is already skipped by IgnoredScopes.
tokens:
  - '\b(?:click|clicking|select|selecting|choose|press|tap|toggle|enable|disable|check|uncheck|expand)(?: on)?(?: the)? ["“][^"”\n]{1,60}["”]'
  - '\b(?:go|navigate) to(?: the)? ["“][^"”\n]{1,60}["”]'
  - '["“][^"”\n]{1,60}["”] (?:button|link|tab|menu|field|dialog|modal|option|toggle|checkbox|dropdown|panel|icon|setting|column|section)s?\b'
