name: Update homepage changelog

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC daily
  workflow_dispatch:
  pull_request:
    paths:
      - custom/scripts/fetch-homepage-changelog.py
      - custom/scripts/tests/test_homepage_changelog.py
      - .github/workflows/update-homepage-changelog.yml

permissions:
  contents: read

concurrency:
  group: homepage-changelog-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test changelog generator
        run: python3 -m unittest discover -s custom/scripts/tests -p 'test_homepage_changelog.py'

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Test changelog generator
        run: python3 -m unittest discover -s custom/scripts/tests -p 'test_homepage_changelog.py'

      - name: Fetch latest changelog entries
        run: python3 custom/scripts/fetch-homepage-changelog.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- snippets/homepage-changelog.mdx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate bot token
        if: steps.changes.outputs.changed == 'true'
        id: bot
        uses: actions/create-github-app-token@v3.4.0
        with:
          app-id: ${{ secrets.NGROK_DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.NGROK_DOCS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Open or update the changelog PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: docs/auto-update-homepage-changelog
        run: |
          git config user.name 'ngrok-docs-bot[bot]'
          git config user.email 'ngrok-docs-bot[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -- snippets/homepage-changelog.mdx
          git commit -m 'docs: refresh homepage changelog'
          # This branch belongs to the workflow, so rebuild it from main on every run.
          # The app token lets CI and Mintlify react to the generated commit.
          git -c credential.helper='!gh auth git-credential' push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'Refresh homepage changelog' \
              --body 'Updates the homepage changelog snippet from the ngrok changelog RSS feed.'
          fi
