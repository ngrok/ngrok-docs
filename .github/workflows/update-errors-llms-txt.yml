name: Update errors llms.txt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "errors/**"
      - "custom/scripts/generate-errors-llms-txt.js"

permissions:
  contents: read

concurrency:
  group: errors-llms-txt-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regenerate:
    # Never expose the docs bot credentials to fork PRs (including Dependabot).
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate errors llms.txt
        run: pnpm run generate-errors-llms

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- errors/llms.txt errors/llms docs.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate bot token
        if: steps.changes.outputs.changed == 'true'
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v2
        with:
          app-id: ${{ secrets.NGROK_DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.NGROK_DOCS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Commit errors llms.txt to the existing PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'ngrok-docs-bot[bot]'
          git config user.email 'ngrok-docs-bot[bot]@users.noreply.github.com'
          git add -A -- errors/llms.txt errors/llms docs.json
          git commit -m 'docs: regenerate errors llms.txt'
          # A normal push rejects concurrent changes instead of overwriting them.
          # The app token lets CI and Mintlify react to the generated commit.
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/$PR_BRANCH"
