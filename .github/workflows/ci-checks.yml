name: CI Checks

permissions: {}

on: push

jobs:
  ci-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: 'pnpm'
      - name: 'Create env file'
        run: |
          echo DEPLOY_ENV=dev > .env
      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile
      - name: Check Traffic Policy action list
        run: pnpm traffic-policy-actions --check
      - name: Check generated error pages
        run: pnpm generate-error-pages --check
      - name: Check generated CLI pages
        run: pnpm generate-cli-pages --check
      - name: Check generated event reference
        run: pnpm generate-event-pages --check
