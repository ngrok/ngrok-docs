name: CI Checks

permissions: {}

on: push

jobs:
  ci-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: 'pnpm'
      - name: 'Create env file'
        run: |
          echo DEPLOY_ENV=dev > .env
      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile
      - name: Check Traffic Policy action list
        run: pnpm traffic-policy-actions --check
      - name: Check generated error pages
        run: pnpm generate-error-pages --check
      - name: Check generated CLI pages
        run: pnpm generate-cli-pages --check
      - name: Check generated event reference
        run: pnpm generate-event-pages --check
      - name: Check llms.txt
        run: pnpm check-llms-txt
