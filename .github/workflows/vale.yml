name: Vale Linting

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  vale:
    name: Run Vale
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          corepack enable
          corepack install
          pnpm install

      - name: Setup PATH for mdx2vast
        run: echo "PATH=${{ github.workspace }}/node_modules/.bin:$PATH" >> $GITHUB_ENV

      - name: Get changed files
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ask the API for the PR's file list rather than diffing base.sha against
          # github.sha. github.sha is the ephemeral merge commit of the PR head into
          # main's *current* tip, so that diff also picks up every change main gained
          # since the PR branched. Those extra files are outside the PR diff, which
          # reviewdog cannot comment on (see filter_mode below).
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            > pr_files.txt

          # Keep markdown only, excluding specific directories and files
          grep -E '\.(mdx|md)$' pr_files.txt \
            | grep -v '^snippets/' \
            | grep -v '^errors/' \
            | grep -v '^\.skills/' \
            | grep -v '^agent/cli-api.mdx$' \
            | grep -v '^agent/cli.mdx$' \
            | grep -v '^style-guide.mdx$' \
            > changed_files.txt || true

          if [ -s changed_files.txt ]; then
            # Build JSON array of files for vale-action's files input
            echo "files=$(jq -R -s -c 'split("\n") | map(select(length > 0))' changed_files.txt)" >> $GITHUB_OUTPUT
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Vale
        if: steps.changed-files.outputs.has_files == 'true'
        uses: vale-cli/vale-action@2.1.2
        with:
          files: ${{ steps.changed-files.outputs.files }}
          # Reports via the Checks API rather than the PR review API. The review
          # reporter fetches the PR's unified diff to anchor its comments, and
          # GitHub answers 406 "diff exceeded the maximum number of lines (20000)"
          # on large PRs -- reviewdog treats that as fatal and exits non-zero, so
          # the check went red on PR size alone with no findings to show for it.
          # Note reviewdog calls Diff() unconditionally in Run(), so filter_mode
          # cannot avoid that fetch; only the doghouse reporters (github-check,
          # github-pr-check) take a path that skips it.
          reporter: github-check
          # Report all issues in the changed files, not only newly added lines:
          # Vale's line numbers can drift from diff positions after MDX parsing.
          # The "Get changed files" step above already scopes Vale to the PR's own
          # files, so diff-based filtering here would be redundant as well as
          # size-dependent. Findings on lines inside the diff still surface inline
          # on Files changed; the rest land in the check run summary.
          filter_mode: nofilter
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
