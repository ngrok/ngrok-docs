# Dependabot will open PRs to update GitHub Actions (and other deps).
# For GitHub Actions it bumps the tag in the workflow and regenerates
# .github/workflows/actions.lock; always confirm the new commit is from the
# official repo (no "imposter commit" warning on GitHub).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
