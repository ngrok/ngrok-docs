# Path-based PR labels, applied by .github/workflows/label-pr.yml.
# Labels are only added, never removed, so manual labels stay put.

# Docs-wide categories

docs/content:
  - changed-files:
      - any-glob-to-any-file: "**/*.mdx"

area/api:
  - changed-files:
      - any-glob-to-any-file:
          - api-reference/**
          - api/**
          - snippets/api/**

docs/design:
  - changed-files:
      - any-glob-to-any-file:
          - style.css
          - snippets/*.jsx
          - logo/**
          - favicon.ico

docs/infra:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/**
          - custom/scripts/**
          - package.json
          - pnpm-lock.yaml
          - "flake.*"
          - "*.js"

docs/style:
  - changed-files:
      - any-glob-to-any-file:
          - .vale/**
          - .vale.ini
          - scripts/vale/**
          - style-guide.mdx
          - .github/workflows/vale.yml
          - .github/workflows/apply-style-guide.yml

docs/ia:
  - changed-files:
      - any-glob-to-any-file: docs.json

# Product areas

area/ai-gateway:
  - changed-files:
      - any-glob-to-any-file:
          - ai-gateway/**
          - openapi/ai-gateway.yaml

area/gateway:
  - changed-files:
      - any-glob-to-any-file:
          - gateway/**
          - snippets/gateway/**

area/traffic-policy:
  - changed-files:
      - any-glob-to-any-file:
          - gateway/traffic-policy/**
          - snippets/traffic-policy/**
          - scripts/test-policies.sh
          - scripts/validate_policy_snippets.py

area/agent:
  - changed-files:
      - any-glob-to-any-file:
          - gateway/agent/**
          - agent-sdks/**
          - snippets/examples/agent-*/**

area/k8s:
  - changed-files:
      - any-glob-to-any-file:
          - gateway/k8s/**
          - snippets/k8s/**
          - snippets/examples/k8s/**
          - getting-started/kubernetes/**
          - integrations/kubernetes-ingress/**

area/errors:
  - changed-files:
      - any-glob-to-any-file:
          - errors/**
          - snippets/errors/**

area/observability:
  - changed-files:
      - any-glob-to-any-file:
          - obs/**
          - snippets/obs/**

area/iam:
  - changed-files:
      - any-glob-to-any-file:
          - iam/**
          - user-management/**

area/integrations:
  - changed-files:
      - any-glob-to-any-file:
          - integrations/**
          - snippets/integrations/**
          - using-ngrok-with/**

area/guides:
  - changed-files:
      - any-glob-to-any-file:
          - integrations/guides/**
          - snippets/guides/**

area/pricing:
  - changed-files:
      - any-glob-to-any-file: pricing-limits/**

area/share-localhost:
  - changed-files:
      - any-glob-to-any-file: share-localhost/**

area/getting-started:
  - changed-files:
      - any-glob-to-any-file:
          - getting-started/**
          - start.mdx
          - glossary.mdx

# Languages and platforms

area/go:
  - changed-files:
      - any-glob-to-any-file:
          - getting-started/go.mdx
          - snippets/examples/go-sdk/**

area/javascript:
  - changed-files:
      - any-glob-to-any-file:
          - getting-started/javascript.mdx
          - snippets/examples/javascript-sdk/**

area/python:
  - changed-files:
      - any-glob-to-any-file:
          - getting-started/python.mdx
          - snippets/examples/python-sdk/**

area/rust:
  - changed-files:
      - any-glob-to-any-file:
          - getting-started/rust.mdx
          - snippets/examples/rust-sdk/**

area/java:
  - changed-files:
      - any-glob-to-any-file:
          - using-ngrok-with/java.mdx
          - snippets/examples/java-sdk/**

area/docker:
  - changed-files:
      - any-glob-to-any-file:
          - using-ngrok-with/docker/**
          - snippets/guides/docker-content.mdx

# Kinds

kind/changelog:
  - changed-files:
      - any-glob-to-any-file:
          - "**/changelog.mdx"
          - snippets/k8s/_changelog.mdx

meta/automated:
  - head-branch:
      - ^ngrokrock/dev-gen-changes$
      - ^docs/auto-gen-
      - ^dependabot/
